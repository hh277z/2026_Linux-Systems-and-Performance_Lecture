# tv.conf: TV eMMC built from the example values of the Week 11 lecture.
# Times are in microseconds and are multiplied by time_scale.
# Any key can be overridden on the nbdkit command line or with tools/emmc.sh up key=value.

size=1G              # device size kept in RAM (the lecture's TV has 32 GB, p.55)

# NAND array (p.15, p.16, p.55)
dies=2               # TV eMMC example: 2 TLC dies (p.15, p.55)
planes=2             # 2 planes per die (p.55)
multiplane=1         # model multi-plane programming (p.52, p.55)
page_kb=16           # p.15, p.16, p.55
pages_per_block=256  # simplified 4 MB TLC block example (p.16)

# NAND timing, TLC user area (p.16, p.41, p.54, p.55)
t_r_us=120           # p.41: NAND tR ≈ 120 us; p.16: TLC read 100–150 us
t_prog_us=1000
t_bers_us=3000

# Optional enhanced (pSLC) area (p.42). 0 = none.
pslc_mb=0
slc_t_r_us=25        # p.14 SLC read 25-50 us (lower end)
slc_t_prog_us=200    # p.31 SLC program about 0.2 ms
slc_t_bers_us=1500   # p.14 SLC erase 1.5-2 ms (lower end)

# Buses (p.39, p.41, p.52)
host_mbps=400        # p.39: HS400, 8-bit, half-duplex
t_cmd_us=1           # p.41: command < 1 us (rounded to 1 us in the model)
nand_mbps=1600       # p.52: a 16 KB page crosses the channel in 10 us

# Controller (p.30, p.54, p.56)
buffer_kb=16         # p.30: one 16 KB device-buffer slot
cache=1              # p.30: volatile write cache
read_priority=1      # simulator policy: reads pass queued programs (read-first, p.56)
suspend=off          # p.54: off | ips | ipc
suspend_phase_us=40  # simulator choice to approximate the ~0.1 ms read in p.54
suspend_max=0        # simulator: 0 = unlimited; p.54 notes real devices cap suspensions
erase_on_open=0      # baseline: do not model erase when opening a block

# Reliability (p.49): % of reads of old data that need one retry; 0 disables retries
read_retry_pct=0

# Multiply every time above (use when the nbd path itself is slow, see README)
time_scale=1
